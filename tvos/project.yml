# XcodeGen spec for the Apple TV app.  On a Mac:
#   brew install xcodegen
#   cd tvos && xcodegen generate && open StreamingFinder.xcodeproj
# Then set your Team under Signing & Capabilities and run on an Apple TV or the simulator.
name: StreamingFinder
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "3"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""          # your Apple Developer team id, or set it in Xcode
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  StreamingFinder:
    type: application
    platform: tvOS
    sources:
      - path: StreamingFinder
    info:
      path: StreamingFinder/Info.plist
      properties:
        CFBundleDisplayName: Streaming Finder
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIUserInterfaceStyle: Dark
        # serve.py runs on your LAN over plain http
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        # Bonjour discovery of serve.py
        NSLocalNetworkUsageDescription: Finds the Streaming Finder server on your home network.
        NSBonjourServices:
          - _streamingfinder._tcp
        # Needed for canOpenURL checks on the streaming apps (see DeepLinks.swift)
        LSApplicationQueriesSchemes:
          - nflx
          - hulu
          - disneyplus
          - hbomax
          - max
          - aiv
          - paramountplus
          - pplus
          - peacock
          - youtube
          - tubitv
          - plutotv
          - crunchyroll
          - starz
          - amcplus
          - mgmplus
          - shudder
          - acorntv
          - britbox
          - mubi
          - criterionchannel
          - hallmarkplus
          - videos
          - com.apple.tv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.streamingfinder
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
